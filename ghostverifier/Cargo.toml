# The ghost reveal verifier's C interface, built as one static library for the
# node to link through cgo (core/ghostpriv/verifier_cgo.go). Build it with
# `go run build/ci.go ghostverifier`, which writes it to build/cache/ghostverifier.
[package]
name = "ghostverifier"
version = "0.1.0"
description = "Static library carrying the ghost-proofs reveal verifiers for the node"
edition = "2024"
publish = false

# The rlib is for the crate's own tests (tests/); the node links the staticlib.
[lib]
crate-type = ["staticlib", "rlib"]

# Its own workspace, apart from anything else in the repository.
[workspace]

# The only dependency, pinned to one revision of the ghost repository.
[dependencies]
ghost-proofs = { git = "https://github.com/ghostcoin-core/ghost", rev = "450b6e1786e346c883af1009abce398b02bf1660" }

# No feature is on by default. unsettled-points-test is for tests only: it
# turns on the test-only provers of ghost-proofs, such as the proof of holding
# prover. The data reveal tests do not need it: the shipped verifier accepts a
# real data reveal and revoke. build/ci.go and the release build never enable
# it.
[features]
unsettled-points-test = ["ghost-proofs/unsettled-points-test"]

# The verifier catches its own panics, so the default panic = "unwind" stays.
[profile.release]
opt-level = 3
codegen-units = 1
