name: CI

# Required checks on main: typecheck, build, unit, fixtures, reproducible.
#
# This repository is public, so jobs run on GitHub-hosted runners: anyone can
# open a pull request, and pull request code must never run on our own hosts.
#
# Pull requests run only typecheck: the full test suite runs as a gate before
# merge (build/ci-gate.sh, the same commands these jobs call). Every other job
# runs on push to main; on a pull request it does not run, and a job left out
# that way still satisfies a required check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main are keyed
# on their own commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use the toolchain setup-go installs from go.mod, never download another.
  GOTOOLCHAIN: local

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt, go mod tidy, go vet, release and link checks
        run: bash build/ci-gate.sh typecheck

  build:
    name: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build every command, run the real-proof verifier tests
        run: bash build/ci-gate.sh build
      - name: Record the geth hash
        run: |
          sha256sum build/bin/geth | cut -d' ' -f1 > geth-linux-amd64-build.sha256
          cat geth-linux-amd64-build.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-build
          path: geth-linux-amd64-build.sha256

  unit-shard:
    name: unit (${{ matrix.shard }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [consensus, core, core-sub, eth, eth-sub, cmd, p2p, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        env:
          SHARD: ${{ matrix.shard }}
        run: bash build/ci-gate.sh unit "$SHARD"

  unit:
    name: unit
    needs: unit-shard
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.unit-shard.result }}
        run: test "$RESULT" = success

  fixtures-part:
    name: fixtures (${{ matrix.part }})
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [state, blockchain, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Ethereum test fixtures
        env:
          PART: ${{ matrix.part }}
        run: bash build/ci-gate.sh fixtures "$PART"

  fixtures:
    name: fixtures
    needs: fixtures-part
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.fixtures-part.result }}
        run: test "$RESULT" = success

  reproducible-target:
    name: reproducible (${{ matrix.target }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-amd64, os: macos-15-intel }
          - { target: windows-amd64, os: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build twice and compare
        run: build/check-reproducible.sh "geth-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hash-${{ matrix.target }}
          path: geth-${{ matrix.target }}.sha256

  reproducible:
    name: reproducible
    needs: [build, reproducible-target]
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every target built twice to the same bytes
        env:
          BUILD: ${{ needs.build.result }}
          TARGETS: ${{ needs.reproducible-target.result }}
        run: test "$BUILD" = success && test "$TARGETS" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hash-*
          merge-multiple: true
      - name: Two machines built the same linux-amd64 geth
        run: |
          cat *.sha256
          cmp geth-linux-amd64-build.sha256 geth-linux-amd64.sha256
