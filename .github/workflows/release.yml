name: Release

# Builds the node for linux, darwin and windows on amd64 and arm64 on every
# push to main, signs each archive with the release key, and publishes a
# GitHub release marked latest. install/install.sh downloads from
# releases/latest/download, so the newest release is the stable pointer.
#
# Each archive is ghost-node-<os>-<arch>.tar.gz and holds the geth executable
# (geth.exe on windows). Its signature, <archive>.sig, is the raw 64-byte
# ed25519 signature of the archive's bytes, which install/install.sh checks
# against install/release-key.pub.
#
# The private key is the Actions secret GHOST_RELEASE_SIGNING_KEY: the PEM
# (PKCS#8) ed25519 private key, as `openssl genpkey -algorithm ed25519`
# writes it. While the secret is not set, the archives are still built and
# kept as workflow artifacts, and signing and publishing are skipped. A key
# whose public half is not install/release-key.pub fails the run, since the
# installer would refuse everything it signed.
#
# Pull requests that change this file build the archives only, on
# GitHub-hosted runners, with no secret and no write access.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# Releases are published one at a time, in push order, so an older build never
# replaces a newer one as latest. A running release is never cancelled; a push
# that is still waiting when a newer one arrives is superseded by it, whose
# release holds its changes too.
concurrency:
  group: release-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The windows-11-arm runner's gcc is an x86-64 mingw toolchain, which
      # cannot assemble the arm64 cgo files. Build windows-arm64 with
      # llvm-mingw's native aarch64 clang instead, pinned by version and
      # checksum.
      - name: Install the aarch64 Windows C toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        env:
          LLVM_MINGW_VERSION: '20261020'
          LLVM_MINGW_SHA256: 8f24fedd0b75c674c6c83dec2d76a7ac31a690120212843a17e465ef49854f69
        run: |
          set -euo pipefail
          name="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-aarch64"
          zip="$RUNNER_TEMP/$name.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$name.zip"
          echo "$LLVM_MINGW_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/$name/bin" >>"$GITHUB_PATH"
          {
            echo "CC=aarch64-w64-mingw32-clang"
            echo "CXX=aarch64-w64-mingw32-clang++"
            echo "CGO_ENABLED=1"
          } >>"$GITHUB_ENV"
      - name: Show the aarch64 Windows C toolchain
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          "$CC" --version
          "$CC" -dumpmachine | grep -q '^aarch64-w64-'
      - name: Build geth
        run: go run build/ci.go install ./cmd/geth
      - name: Package
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = "$OS/$ARCH"
          exe=geth
          [ "$OS" = windows ] && exe=geth.exe
          if [ "$OS" = linux ]; then
            kind="$(file build/bin/geth)"
            echo "$kind"
            [[ $kind == *"statically linked"* ]] || { echo "geth is not statically linked"; exit 1; }
          fi
          mkdir -p dist/stage
          cp "build/bin/$exe" "dist/stage/$exe"
          archive="ghost-node-$OS-$ARCH.tar.gz"
          tar -C dist/stage -czf "dist/$archive" "$exe"
          tar -tzf "dist/$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ghost-node-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Is the release key set
        id: key
        env:
          HAS_KEY: ${{ secrets.GHOST_RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = true ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::The Actions secret GHOST_RELEASE_SIGNING_KEY is not set, so this build is not signed or published. The unsigned archives are kept as this run's artifacts."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
          sparse-checkout: install/release-key.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.key.outputs.present == 'true'
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Sign
        if: steps.key.outputs.present == 'true'
        env:
          GHOST_RELEASE_SIGNING_KEY: ${{ secrets.GHOST_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$GHOST_RELEASE_SIGNING_KEY" >"$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/signing.pub"
          if ! cmp -s <(openssl pkey -pubin -in "$RUNNER_TEMP/signing.pub" -outform DER) \
                      <(openssl pkey -pubin -in install/release-key.pub -outform DER); then
            echo "::error::GHOST_RELEASE_SIGNING_KEY is not the key of install/release-key.pub; the installer would refuse this release."
            exit 1
          fi
          count=0
          for archive in dist/ghost-node-*.tar.gz; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$archive" -out "$archive.sig"
            test "$(wc -c <"$archive.sig")" -eq 64
            openssl pkeyutl -verify -pubin -inkey install/release-key.pub -rawin -in "$archive" -sigfile "$archive.sig"
            count=$((count + 1))
          done
          test "$count" -eq 6
          (cd dist && sha256sum ghost-node-*.tar.gz >SHA256SUMS)
          ls -l dist
      - name: Publish the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="build-$RUN-${SHA:0:12}"
          gh release create "$tag" dist/ghost-node-*.tar.gz dist/ghost-node-*.tar.gz.sig dist/SHA256SUMS \
            --target "$SHA" --title "Ghost node $tag" --latest \
            --notes "Ghost node built from $SHA. Install with install/install.sh, which checks each archive's .sig against the release key."
